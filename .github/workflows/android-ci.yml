name: Android Upload Check

on:
  workflow_dispatch:

jobs:
  verify-local-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check local release artifacts and checksums exist
        run: |
          test -f release-artifacts/app-release.apk
          test -f release-artifacts/app-release.aab
          test -f release-artifacts/app-release.apk.sha256
          test -f release-artifacts/app-release.aab.sha256

      - name: Verify checksums
        run: |
          expected_apk="$(tr -d ' \r\n' < release-artifacts/app-release.apk.sha256)"
          actual_apk="$(sha256sum release-artifacts/app-release.apk | awk '{print $1}')"
          test "$expected_apk" = "$actual_apk"
          expected_aab="$(tr -d ' \r\n' < release-artifacts/app-release.aab.sha256)"
          actual_aab="$(sha256sum release-artifacts/app-release.aab | awk '{print $1}')"
          test "$expected_aab" = "$actual_aab"

      - name: Upload local APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-local
          path: release-artifacts/app-release.apk

      - name: Upload local AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-local
          path: release-artifacts/app-release.aab

      - name: Upload local checksum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-checksums-local
          path: |
            release-artifacts/app-release.apk.sha256
            release-artifacts/app-release.aab.sha256
