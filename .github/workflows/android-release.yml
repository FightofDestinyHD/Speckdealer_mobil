name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local artifacts
        run: |
          test -f release-artifacts/app-release.apk
          test -f release-artifacts/app-release.aab

      - name: Create GitHub Release from local artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
