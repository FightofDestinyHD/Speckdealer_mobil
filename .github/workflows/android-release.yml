name: Android Release Verification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub Release assets exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "app-release.apk" --dir tmp/github-check --clobber
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "app-release.aab" --dir tmp/github-check --clobber
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "app-release.apk.sha256" --dir tmp/github-check --clobber
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "app-release.aab.sha256" --dir tmp/github-check --clobber
          test -s tmp/github-check/app-release.apk
          test -s tmp/github-check/app-release.aab
          test -s tmp/github-check/app-release.apk.sha256
          test -s tmp/github-check/app-release.aab.sha256

      - name: Verify GitHub Release checksums
        run: |
          expected_apk="$(awk '{print $1}' tmp/github-check/app-release.apk.sha256 | tr -d '\r\n')"
          actual_apk="$(sha256sum tmp/github-check/app-release.apk | awk '{print $1}')"
          test "$expected_apk" = "$actual_apk"

          expected_aab="$(awk '{print $1}' tmp/github-check/app-release.aab.sha256 | tr -d '\r\n')"
          actual_aab="$(sha256sum tmp/github-check/app-release.aab | awk '{print $1}')"
          test "$expected_aab" = "$actual_aab"
