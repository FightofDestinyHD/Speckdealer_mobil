name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Vorhandener Tag (z. B. v0.1.39)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-build-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: bash ./gradlew test

      - name: Run lint
        run: bash ./gradlew lint

      - name: Assemble debug
        run: bash ./gradlew assembleDebug

  release:
    runs-on: ubuntu-latest
    needs: verify-build-and-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local artifacts and checksums
        run: |
          test -f release-artifacts/app-release.apk
          test -f release-artifacts/app-release.aab
          test -f release-artifacts/app-release.apk.sha256
          test -f release-artifacts/app-release.aab.sha256

      - name: Verify checksums before release
        run: |
          expected_apk="$(tr -d ' \r\n' < release-artifacts/app-release.apk.sha256)"
          actual_apk="$(sha256sum release-artifacts/app-release.apk | awk '{print $1}')"
          test "$expected_apk" = "$actual_apk"
          expected_aab="$(tr -d ' \r\n' < release-artifacts/app-release.aab.sha256)"
          actual_aab="$(sha256sum release-artifacts/app-release.aab | awk '{print $1}')"
          test "$expected_aab" = "$actual_aab"

      - name: Create GitHub Release from local artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.aab
            release-artifacts/app-release.apk.sha256
            release-artifacts/app-release.aab.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
