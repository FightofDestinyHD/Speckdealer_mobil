name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release artifacts exist and are non-empty
        run: |
          test -s release-artifacts/app-release.apk
          test -s release-artifacts/app-release.aab
          test -s release-artifacts/app-release.apk.sha256
          test -s release-artifacts/app-release.aab.sha256

      - name: Verify checksums
        run: |
          expected_apk="$(awk '{print $1}' release-artifacts/app-release.apk.sha256 | tr -d '\r\n')"
          actual_apk="$(sha256sum release-artifacts/app-release.apk | awk '{print $1}')"
          test "$expected_apk" = "$actual_apk"

          expected_aab="$(awk '{print $1}' release-artifacts/app-release.aab.sha256 | tr -d '\r\n')"
          actual_aab="$(sha256sum release-artifacts/app-release.aab | awk '{print $1}')"
          test "$expected_aab" = "$actual_aab"

      - name: Create GitHub Release from local artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.aab
            release-artifacts/app-release.apk.sha256
            release-artifacts/app-release.aab.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
